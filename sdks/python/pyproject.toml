[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crw"
version = "0.36.0"
description = "Python SDK for CRW web scraper — scrape, crawl, and map any website from Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "fastCRW", email = "hello@fastcrw.com" }]
maintainers = [{ name = "fastCRW", email = "hello@fastcrw.com" }]
keywords = ["web-scraping", "mcp", "ai-agent", "crawler", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["platformdirs>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-timeout>=2.0"]
langchain = ["langchain-core>=0.3.0,<2.0.0"]
crewai = ["crewai>=0.100.0"]

[project.urls]
Homepage = "https://fastcrw.com"
Documentation = "https://docs.fastcrw.com"
Repository = "https://github.com/us/crw"
Issues = "https://github.com/us/crw/issues"

[project.scripts]
crw-mcp = "crw.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real APIs (need CRW_API_KEY env var)",
]
timeout = 120

[tool.hatch.build.targets.wheel]
packages = ["src/crw"]
