[package]
name = "crw-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HTTP and CDP browser rendering engine for the CRW web scraper"

[features]
default = []
cdp = ["tokio-tungstenite", "crw-core/cdp"]
auto-browser = ["dep:dirs"]
# Opt-in Camoufox stealth renderer tier (REST, not CDP). Gates the `camoufox`
# module and its construction in `FallbackRenderer::new`. Default off so the
# lean build is byte-identical. Forwards to `crw-core/camoufox` for the
# config-level predicate and deadline math.
camoufox = ["crw-core/camoufox"]
# Opt-in cloak Turnstile-solver recovery tier (REST). Feature-gated + config-gated;
# absent from all defaults, so the lean build is byte-identical.
cloak = ["crw-core/cloak"]
# Opt-in Chrome-impersonation HTTP tier (wreq). Gates the `impersonated`
# module and its construction in `FallbackRenderer`. Default off so the lean
# build never links the wreq/btls TLS stack. Forwards to `crw-core/impersonated`
# for the config-level predicate and deadline math.
impersonated = ["crw-core/impersonated", "dep:wreq", "dep:wreq-util"]

[dependencies]
crw-core = { workspace = true }
crw-extract = { workspace = true }
reqwest = { workspace = true }
# Chrome TLS/JA3/HTTP2 impersonation client (impersonated feature only).
# Decompression features because the Chrome emulation preset advertises
# br/gzip/zstd Accept-Encoding; defaults (chromium-roots + tokio-rt) stay on.
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], optional = true }
futures = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
rand = { workspace = true }
dashmap = { workspace = true }
dirs = { version = "7", optional = true }
moka = { workspace = true }
publicsuffix = { workspace = true }
regex = { workspace = true }
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }
flate2 = "1"
brotli = "9"
wiremock = { workspace = true }
